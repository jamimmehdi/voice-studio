<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self' 'unsafe-inline';">
<title>Voice Studio – icon</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  .orb {
    position: absolute; inset: 4px; border-radius: 50%; cursor: pointer;
    background: #0d1118 url('../../build/icon.png') center/76% no-repeat;
    border: 2px solid #3a4458; box-shadow: 0 6px 18px rgba(0,0,0,.55);
    transition: border-color .15s, box-shadow .15s;
  }
  .orb.on { border-color: #34f5c5; box-shadow: 0 0 0 3px rgba(52,245,197,.18), 0 0 18px rgba(52,245,197,.55), 0 6px 18px rgba(0,0,0,.55); }
  .orb:hover { filter: brightness(1.15); }
  .dot { position: absolute; right: 6px; bottom: 6px; width: 12px; height: 12px; border-radius: 50%; background: #4a5468; border: 2px solid #0d1118; pointer-events: none; }
  .orb.on + .dot { background: #34f5c5; }
</style>
</head>
<body>
<div id="orb" class="orb" title="Voice Studio – click for the compact panel"></div>
<div class="dot"></div>
<script>
  const orb = document.getElementById('orb');
  window.quick.onState((s) => { if (s) orb.classList.toggle('on', !!s.running); });

  // a click opens the compact panel; a drag moves the icon
  let down = false, moved = 0, lastX = 0, lastY = 0;
  orb.addEventListener('pointerdown', (e) => {
    down = true; moved = 0; lastX = e.screenX; lastY = e.screenY;
    try { orb.setPointerCapture(e.pointerId); } catch (_) { /* */ }
  });
  orb.addEventListener('pointermove', (e) => {
    if (!down) return;
    const dx = e.screenX - lastX, dy = e.screenY - lastY;
    lastX = e.screenX; lastY = e.screenY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (dx || dy) window.quick.iconDrag(dx, dy);
  });
  const up = () => {
    if (!down) return;
    down = false;
    if (moved < 5) window.quick.send({ type: 'openCompact' });
    else window.quick.iconDragEnd();
  };
  orb.addEventListener('pointerup', up);
  orb.addEventListener('pointercancel', () => { down = false; });
</script>
</body>
</html>

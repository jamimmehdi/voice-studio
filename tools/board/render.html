<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Design board reference render</title>
<style>
@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 400; src: url('/renderer/fonts/plus-jakarta-sans-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 500; src: url('/renderer/fonts/plus-jakarta-sans-latin-500-normal.woff2') format('woff2'); }
@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 600; src: url('/renderer/fonts/plus-jakarta-sans-latin-600-normal.woff2') format('woff2'); }
@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 700; src: url('/renderer/fonts/plus-jakarta-sans-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Plus Jakarta Sans'; font-weight: 800; src: url('/renderer/fonts/plus-jakarta-sans-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('/renderer/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('/renderer/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2'); }
body { margin: 0; background: #0a0d12; }
button, select { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// Expands the board's .dc.html template (holes, sc-for, sc-if) into plain DOM for visual comparison.
(async () => {
  const text = await (await fetch('/board/Main.dc.html')).text();
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const code = doc.querySelector('script[data-dc-script]').textContent;
  class DCLogic { constructor() { this.props = {}; } }
  const Comp = new Function('DCLogic', code + '\nreturn Component;')(DCLogic);
  const vals = new Comp().renderVals();

  const look = (path, scope) => {
    path = path.trim();
    if (path === 'true') return true;
    if (path === 'false') return false;
    return path.split('.').reduce((o, k) => (o == null ? o : o[k]), scope);
  };
  const fill = (s, scope) => s.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (_, p) => { const v = look(p, scope); return v == null ? '' : v; });

  function expand(node, scope) {
    [...node.childNodes].forEach((ch) => {
      if (ch.nodeType === 3) { ch.textContent = fill(ch.textContent, scope); return; }
      if (ch.nodeType !== 1) return;
      const tag = ch.tagName.toLowerCase();
      if (tag === 'sc-for') {
        const list = look(ch.getAttribute('list').replace(/[{}]/g, ''), scope) || [];
        const as = ch.getAttribute('as');
        const frag = document.createDocumentFragment();
        list.forEach((item, i) => {
          const sub = Object.assign({}, scope, { [as]: item, $index: i });
          [...ch.childNodes].forEach((c) => {
            const clone = c.cloneNode(true);
            const holder = document.createElement('div');
            holder.appendChild(clone);
            expand(holder, sub);
            [...holder.childNodes].forEach((x) => frag.appendChild(x));
          });
        });
        ch.replaceWith(frag);
      } else if (tag === 'sc-if') {
        const ok = look(ch.getAttribute('value').replace(/[{}]/g, ''), scope);
        if (ok) { expand(ch, scope); ch.replaceWith(...ch.childNodes); } else ch.remove();
      } else {
        [...ch.attributes].forEach((a) => { if (a.value.includes('{{')) ch.setAttribute(a.name, fill(a.value, scope)); });
        expand(ch, scope);
      }
    });
  }

  const dc = doc.querySelector('x-dc');
  const helm = dc.querySelector('helmet');
  if (helm) helm.remove();
  expand(dc, vals);
  const root = document.getElementById('root');
  while (dc.firstChild) root.appendChild(dc.firstChild);
  document.title = 'board-ready';
})();
</script>
</body>
</html>
